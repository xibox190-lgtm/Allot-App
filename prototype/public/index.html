<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Allot · 导入计划</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top"><span class="brand">Allot<span class="brand-dot"></span></span><span class="mode">本地演示 · 未接 API</span></header>
    <section class="intro">
      <p class="eyebrow">从你的想法开始</p>
      <h1>一起整理<br>你的投资计划<span class="period">.</span></h1>
      <p class="intro-copy">发一段话、一份 Markdown，或一张截图。<br>先整理成草稿，确认后再使用。</p>
      <button id="sample" class="sample-button" type="button">试试半年计划 <span aria-hidden="true">↗</span></button>
    </section>

    <section id="conversation" class="conversation" aria-label="计划对话" aria-live="polite"></section>

    <section id="draft" class="draft" aria-labelledby="draft-title" hidden>
      <div class="draft-heading"><div><span class="eyebrow">PLAN DRAFT</span><h2 id="draft-title">计划草稿</h2></div><span id="draft-status" class="draft-status">待确认</span></div>
      <div class="draft-meta"><label>开始月份 <input id="start-month" type="month" aria-label="计划开始月份"></label><span id="duration"></span></div>
      <p id="start-hint" class="small-note">相对月份暂按本月起算，可在此调整。</p>
      <div id="months" class="months" role="group" aria-label="查看月份"></div>
      <div id="assets" class="assets"></div>
      <div class="totals"><div><span>月度合计</span><strong id="month-total"></strong></div><div><span>整份计划</span><strong id="plan-total"></strong></div></div>
      <p class="small-note">金额可直接修改，也可以继续对话调整。</p>
      <p id="draft-error" class="error" role="alert"></p>
      <button id="use-plan" class="primary" type="button">使用计划 <span aria-hidden="true">↗</span></button>
      <p id="saved-note" class="small-note" role="status"></p>
    </section>

    <form id="composer" class="composer">
      <div id="attachments" class="attachments" aria-label="已添加附件"></div>
      <textarea id="message" rows="2" placeholder="说说你的计划…" aria-label="发送给 AI 的计划内容"></textarea>
      <div class="composer-actions"><div><button id="attach" type="button" class="attach-button" aria-label="添加图片或 Markdown">＋</button><span class="input-hint">图片 / MD / 文字</span></div><button id="send" type="submit" class="send-button" aria-label="发送计划">↑</button></div>
      <input id="files" type="file" accept="image/png,image/jpeg,image/webp,.md,.markdown,.txt" multiple hidden>
      <p id="input-error" class="error" role="alert"></p>
    </form>
    <p class="footnote">演示支持 Markdown 表格；图片理解与自由对话待接入 API。</p>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
